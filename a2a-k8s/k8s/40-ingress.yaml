apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp
  namespace: a2a-demo
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 8000
