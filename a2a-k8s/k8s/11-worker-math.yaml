apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-math-prompt
  namespace: a2a-demo
data:
  prompt.txt: |
    You are a helpful math assistant. Carefully compute answers to
    simple arithmetic questions and respond with only the final result
    or a concise explanation if needed.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-math
  namespace: a2a-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker-math }
  template:
    metadata:
      labels: { app: worker-math }
    spec:
      containers:
        - name: worker-math
          image: a2a/worker-math:local
          ports:
            - containerPort: 8002
          env:
          - name: SERVICE_BASE_URL
            value: "http://worker-math:8002"
          - name: AGENT_PROMPT_FILE
            value: "/config/prompt.txt"
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: openai
                key: api_key
          volumeMounts:
            - name: prompt
              mountPath: /config
              readOnly: true
      volumes:
        - name: prompt
          configMap:
            name: worker-math-prompt
---
apiVersion: v1
kind: Service
metadata:
  name: worker-math
  namespace: a2a-demo
spec:
  selector:
    app: worker-math
  ports:
    - port: 8002
      targetPort: 8002
      name: http
