<!DOCTYPE html>
<html>
<head>
    <style>
        .placeholder {
            width: 300px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            margin: 10px;
        }
        .iphone { background: linear-gradient(135deg, #000, #333); }
        .appstore { background: linear-gradient(135deg, #007AFF, #0051D2); }
        .android { background: linear-gradient(135deg, #3DDC84, #1C7C54); }
        .ipad { background: linear-gradient(135deg, #000, #444); }
        .lte { background: linear-gradient(135deg, #FF6B35, #F7931E); }
        .watch { background: linear-gradient(135deg, #000, #333); }
        .fold { background: linear-gradient(135deg, #1f1f23, #8B5CF6); }
        .fiveg { background: linear-gradient(135deg, #007AFF, #34C759); }
    </style>
</head>
<body>
    <canvas id="canvas" width="300" height="200"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function createImage(bgGradient, text, filename) {
            ctx.clearRect(0, 0, 300, 200);
            const gradient = ctx.createLinearGradient(0, 0, 300, 200);
            gradient.addColorStop(0, bgGradient[0]);
            gradient.addColorStop(1, bgGradient[1]);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 300, 200);
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 150, 100);
            
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // Generate all images
        setTimeout(() => createImage(['#000', '#333'], 'iPhone\n2007', 'iphone-2007.png'), 100);
        setTimeout(() => createImage(['#007AFF', '#0051D2'], 'App Store\n2008', 'app-store.png'), 200);
        setTimeout(() => createImage(['#3DDC84', '#1C7C54'], 'Android\nHTC Dream', 'htc-dream-android.png'), 300);
        setTimeout(() => createImage(['#000', '#444'], 'iPad\n2010', 'ipad-first-gen.png'), 400);
        setTimeout(() => createImage(['#FF6B35', '#F7931E'], 'iPhone 5\n4G LTE', 'iphone-5-lte.png'), 500);
        setTimeout(() => createImage(['#000', '#333'], 'Apple Watch\n2014', 'apple-watch.png'), 600);
        setTimeout(() => createImage(['#1f1f23', '#8B5CF6'], 'Galaxy Fold\n2019', 'galaxy-fold.png'), 700);
        setTimeout(() => createImage(['#007AFF', '#34C759'], 'iPhone 12\n5G', 'iphone-12-5g.png'), 800);
    </script>
</body>
</html>
